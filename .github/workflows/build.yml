name: Build Android APK

# Pemicu: Jalankan build setiap kali ada push atau pull request di branch 'main'
on:
  push:
    branches: [ "gps-traker" ]
  pull_request:
    branches: [ "gps-traker" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Ambil kode dari repositori GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Siapkan lingkungan Java (Android Studio membutuhkan Java)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    # 3. Berikan izin akses pada Gradle Wrapper agar bisa dieksekusi
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    # 4. Proses kompilasi / build menjadi APK Debug
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # 5. Upload hasil APK agar bisa di-download oleh Anda
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

